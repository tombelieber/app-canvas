name: Public synthetic canvas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-canvas
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y --no-install-recommends xauth
      - run: npm run test:import && npm run test:grouping
      - run: npm run test:review
      - run: npm run test:reference
      - run: npm run test:onboarding
      - run: npm run test:dom && npm run test:legacy && npm run test:navigation && npm run test:height && npm run test:journeys
      - run: npm run test:queue && npm run test:file && node tests/action-focus.browser.mjs && npm run test:demo && npm run test:demo-controls
      - run: npm run test:native-overview && APP_CANVAS_TEST_NATIVE_ATLAS=1 npm run test:demo-controls
      - run: npm run test:touch && xvfb-run -a env APP_CANVAS_HEADED=1 npm run test:tablet
      - run: npm run test:population
      # test:tablet already runs shared-preview and all 480 zoom samples on a rendered display.
      - run: node tests/overview-quality.browser.mjs
      - run: npm run test:overview-budget && npm run test:readiness
      - run: npm run build:demo
      - run: npm run test:static
      - run: npm run test:launch && npm run test:i18n && npm run test:telemetry
      - run: npm ci --prefix services/cloud && npm run check --prefix services/cloud && npm run test:waitlist
      - run: npm run check:privacy -- .artifacts/site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public synthetic canvas
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
