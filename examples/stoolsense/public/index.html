<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf5f6"><title>StoolSense｜私人健康紀錄</title><link rel="stylesheet" href="/style.css"><script type="module" src="/assets/frame.js"></script><style>.review-confirm{border:1px solid #b9c8d0;border-radius:12px;padding:22px;width:calc(100% - 36px);max-width:420px;background:white;color:#163b45}.review-confirm::backdrop{background:#20374066}</style></head>
