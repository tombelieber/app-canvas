  short_description: "Populate source UI or capture an editable URL landscape"
  default_prompt: "Use $app-canvas to select the repository or desktop URL input path. For URL input, follow references/url-import.md, capture observed states and verify edit/save/reopen in App Canvas. For repository input, discover and populate this repository's complete UI landscape, including components, variants, states and navigation. Create missing fixtures and render harnesses, reconcile the source inventory and verify all required cases before calling it complete."
